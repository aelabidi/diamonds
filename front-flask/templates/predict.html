{% extends "base.html" %}
{% block title %}Predict – Diamonds Price Prediction{% endblock %}

{% block content %}
<div class="card">
    <h2>Predict Diamond Price</h2>

    <!-- Clockwise-rotating cats -->
    <div class="cat-container">
        <span class="cat">🐱</span>
        <span class="cat">🐈</span>
        <span class="cat">😸</span>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if prediction is not none %}
    <div class="alert alert-success">
        Predicted Price: <span class="price-tag">${{ "%.2f"|format(prediction) }}</span>
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('predict') }}">

        <div class="form-row">
            <div class="form-group">
                <label for="carat">
                    Carat
                    <span class="slider-value" id="carat-val">
                        {{ form_data.get('carat', '0.5') }}
                    </span>
                </label>
                <input
                    type="range" id="carat" name="carat"
                    class="form-control"
                    min="0.2" max="5.0" step="0.1"
                    value="{{ form_data.get('carat', '0.5') }}"
                    oninput="document.getElementById('carat-val').textContent = this.value"
                />
            </div>

            <div class="form-group">
                <label for="depth">
                    Depth
                    <span class="slider-value" id="depth-val">
                        {{ form_data.get('depth', '61.0') }}
                    </span>
                </label>
                <input
                    type="range" id="depth" name="depth"
                    class="form-control"
                    min="50.0" max="70.0" step="0.1"
                    value="{{ form_data.get('depth', '61.0') }}"
                    oninput="document.getElementById('depth-val').textContent = this.value"
                />
            </div>

            <div class="form-group">
                <label for="table">
                    Table
                    <span class="slider-value" id="table-val">
                        {{ form_data.get('table', '55.0') }}
                    </span>
                </label>
                <input
                    type="range" id="table" name="table"
                    class="form-control"
                    min="50.0" max="70.0" step="0.1"
                    value="{{ form_data.get('table', '55.0') }}"
                    oninput="document.getElementById('table-val').textContent = this.value"
                />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cut">Cut</label>
                <select id="cut" name="cut" class="form-control">
                    {% for opt in cut_options %}
                    <option value="{{ opt }}"
                        {{ 'selected' if form_data.get('cut') == opt }}>
                        {{ opt }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="color">Color</label>
                <select id="color" name="color" class="form-control">
                    {% for opt in color_options %}
                    <option value="{{ opt }}"
                        {{ 'selected' if form_data.get('color') == opt }}>
                        {{ opt }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="clarity">Clarity</label>
                <select id="clarity" name="clarity" class="form-control">
                    {% for opt in clarity_options %}
                    <option value="{{ opt }}"
                        {{ 'selected' if form_data.get('clarity') == opt }}>
                        {{ opt }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="x">X – length (mm)</label>
                <input
                    type="number" id="x" name="x"
                    class="form-control"
                    min="0" max="10" step="0.1"
                    value="{{ form_data.get('x', '0.0') }}"
                />
            </div>

            <div class="form-group">
                <label for="y">Y – width (mm)</label>
                <input
                    type="number" id="y" name="y"
                    class="form-control"
                    min="0" max="10" step="0.1"
                    value="{{ form_data.get('y', '0.0') }}"
                />
            </div>

            <div class="form-group">
                <label for="z">Z – depth (mm)</label>
                <input
                    type="number" id="z" name="z"
                    class="form-control"
                    min="0" max="10" step="0.1"
                    value="{{ form_data.get('z', '0.0') }}"
                />
            </div>
        </div>

        <button type="submit" class="btn btn-primary">✨ Predict Price</button>
    </form>
</div>
{% endblock %}
